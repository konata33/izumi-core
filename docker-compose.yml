services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: izumi_core
      POSTGRES_USER: izumi
      POSTGRES_PASSWORD: izumi
    ports:
      - '${POSTGRES_PORT:-54329}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U izumi -d izumi_core']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6389}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:-izumi}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-izumi-development-secret}'
      MINIO_API_CORS_ALLOW_ORIGIN: '${MINIO_API_CORS_ALLOW_ORIGIN:-*}'
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:-izumi}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-izumi-development-secret}'
      MINIO_BUCKET: '${MINIO_BUCKET:-izumi-media}'
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}-quarantine"
        mc anonymous set download "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}-quarantine"

volumes:
  postgres_data:
  redis_data:
  minio_data:
