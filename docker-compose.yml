services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: izumi_core
      POSTGRES_USER: izumi
      POSTGRES_PASSWORD: izumi
    ports:
      - '${POSTGRES_PORT:-54329}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U izumi -d izumi_core']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6389}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
